name: Daily DGEG Download

on:
  schedule:
    - cron: "10 12 * * *"
  workflow_dispatch:

jobs:
  download-and-build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium

      - name: Run downloader
        run: python downloader.py

      - name: Build model-ready dataset
        run: python build_model_ready.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --cached panel/main_data.csv model_ready/main_data_model_ready.csv 2>/dev/null || true
          git add raw/ processed_daily/ panel/main_data.parquet model_ready/main_data_model_ready.parquet logs/
          git commit -m "Daily DGEG update" || echo "No changes to commit"
          git push
